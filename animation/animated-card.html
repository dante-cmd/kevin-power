<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/style-card.css">
    <title>Animated Card</title>
</head>
<body>
    
    <div class="game">
        <div class="rank">
            <span>3</span>
        </div>
        <div class="front">
            <img class="thumbnail" src="https://pics.filmaffinity.com/Pok_mon_Detective_Pikachu-220563876-large.jpg" alt="">
            <div class="name-stats">
                <h3 class="name">Pokémon Detective Pikachu </h3>
                <div class="stats">
                    <span class="viewers">539.9k</span>
                    <div class="streamers">
                        <img src="assets/image/css-icon.svg" alt="">
                        <img src="assets/image/power-bi-icon.svg" alt="">
                        <img src="assets/image/python-icon.svg" alt="">
                    </div>
                </div>

            </div>
            
        </div>
        <div class="back">
            <div class="streaming-info">
                <div class="game-stat">559k<span>Python</span></div>
                <div class="game-stat">25.8<span>R</span></div>
            </div>
            <button class="btn">See more streaming</button>
            <div class="streamer">
                <p class="name">Gamer 1</p>
                <p class="number">36.1k</p>
            </div>
            <div class="streamer">
                <p class="name">Gamer 2</p>
                <p class="number">35.1k</p>
            </div>
            <div class="streamer">
                <p class="name">Gamer 3</p>
                <p class="number">34.1k</p>
            </div>
        </div>
        <div class="background">
            
        </div>

    </div>
    
</body>
</html>
